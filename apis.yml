aid: qnovia
name: Qnovia
description: >-
  Qnovia, Inc. is a clinical-stage pharmaceutical and drug-device company developing inhaled
  therapeutics built on its proprietary RespiRx aseptically pre-filled, portable vibrating-mesh
  nebulizer platform. Its lead asset, the RespiRx Nicotine Inhaler (QN-01), is a prescription
  smoking-cessation therapy that cleared FDA IND review and has dosed patients in a U.S. Phase 1
  study; a cognitive behavioral therapy (CBT) program is advancing toward a second IND. The device
  is Bluetooth Low Energy connected and pairs with Neblit AI, a cloud-connected companion app and
  machine-learning platform that tracks dose events and delivers behavioral interventions, which the
  company positions as a digital therapeutic layer over the pharmacotherapy. Founded in 2018 as
  Respira Technologies and rebranded to Qnovia in 2022, the company is led by founder and CEO Mario
  Danek, operates R&D and manufacturing in Newport Beach/Irvine, California and an R&D facility in
  Richmond, Virginia, and has raised roughly $50 million to date. Qnovia publishes no public API,
  developer portal, SDK, or machine-readable contract; its corporate site is a client-rendered
  single-page application whose only HTTP API is a private backend serving its own contact, careers
  and investor-portal forms.
